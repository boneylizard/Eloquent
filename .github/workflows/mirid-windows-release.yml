name: Qualify and publish Mirid for Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already set in package.json, Cargo.toml, and tauri.conf.json
        required: true
        default: 1.0.12
        type: string
      prerelease:
        description: Mark this GitHub release as a pre-release
        required: true
        default: false
        type: boolean
      publish_release:
        description: Publish the qualified candidate as a GitHub release
        required: true
        default: false
        type: boolean
  push:
    branches:
      - "candidate/v*.*.*"
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: mirid-windows-release
  cancel-in-progress: false

jobs:
  build:
    name: Build signed Windows candidate
    runs-on: windows-2025
    timeout-minutes: 120
    outputs:
      version: ${{ steps.release_metadata.outputs.version }}
      prerelease: ${{ steps.release_metadata.outputs.prerelease }}
      artifact_name: ${{ steps.release_files.outputs.artifact_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve release metadata
        id: release_metadata
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $version = $env:DISPATCH_VERSION
            $prerelease = $env:DISPATCH_PRERELEASE.ToLowerInvariant()
          }
          elseif ($env:REF_NAME -match '^candidate/v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            $version = $Matches['version']
            $prerelease = if ($version.Contains('-')) { 'true' } else { 'false' }
          }
          else {
            if ($env:REF_NAME -notmatch '^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
              throw "Release tag '$env:REF_NAME' is not a supported semantic version tag."
            }
            $version = $Matches['version']
            $prerelease = if ($version.Contains('-')) { 'true' } else { 'false' }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Verify release version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release_metadata.outputs.version }}
        run: |
          $packageVersion = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          $versions = @(@($packageVersion, $tauriVersion, $cargoVersion) | Select-Object -Unique)
          if ($versions.Count -ne 1 -or $versions[0] -ne $env:RELEASE_VERSION) {
            throw "Requested $env:RELEASE_VERSION, but source versions are package=$packageVersion tauri=$tauriVersion cargo=$cargoVersion."
          }

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      - name: Check hosted release dependencies
        working-directory: frontend
        run: npm run release:check

      - name: Fetch verified desktop sidecar
        shell: pwsh
        run: |
          $manifest = Get-Content runtime/runtime-release.json -Raw | ConvertFrom-Json
          $asset = $manifest.assets.sidecarExecutable
          $destination = Join-Path $PWD "src-tauri/binaries/$($asset.filename)"
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
          Invoke-WebRequest "$($manifest.baseUrl)/$($asset.filename)?download=true" -OutFile $destination
          $file = Get-Item -LiteralPath $destination
          $hash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($file.Length -ne [int64]$asset.size -or $hash -ne [string]$asset.sha256) {
            throw "Downloaded sidecar does not match runtime/runtime-release.json."
          }

      - name: Verify updater signing key
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is not configured in this repository."
          }

      - name: Build Windows installer
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build

      - name: Prepare release files
        id: release_files
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.release_metadata.outputs.version }}
        run: |
          $installer = "src-tauri/target/release/bundle/nsis/Mirid_$($env:RELEASE_VERSION)_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Installer not found at $installer"
          }
          $installerSignature = "$installer.sig"
          if (-not (Test-Path -LiteralPath $installerSignature)) {
            throw "Updater signature not found at $installerSignature"
          }
          $candidateDirectory = Join-Path $PWD 'release-candidate'
          New-Item -ItemType Directory -Force -Path $candidateDirectory | Out-Null
          $stagedInstaller = Join-Path $candidateDirectory ([IO.Path]::GetFileName($installer))
          $stagedInstallerSignature = "$stagedInstaller.sig"
          Copy-Item -LiteralPath $installer -Destination $stagedInstaller
          Copy-Item -LiteralPath $installerSignature -Destination $stagedInstallerSignature

          $signature = (Get-Content -LiteralPath $installerSignature -Raw).Trim()
          $assetUrl = "https://github.com/boneylizard/Eloquent/releases/download/v$($env:RELEASE_VERSION)/$([IO.Path]::GetFileName($installer))"
          $latest = [ordered]@{
            version = $env:RELEASE_VERSION
            notes = "Mirid $($env:RELEASE_VERSION) is ready. See the GitHub release for details."
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url = $assetUrl
              }
            }
          }
          [IO.File]::WriteAllText(
            (Join-Path $candidateDirectory 'latest.json'),
            ($latest | ConvertTo-Json -Depth 6),
            [Text.UTF8Encoding]::new($false)
          )
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          "$hash  $([IO.Path]::GetFileName($installer))" |
            Set-Content -Encoding ascii (Join-Path $candidateDirectory 'SHA256SUMS.txt')
          $changelog = Get-Content CHANGELOG.md -Raw
          $versionPattern = [Regex]::Escape($env:RELEASE_VERSION)
          $match = [Regex]::Match(
            $changelog,
            "(?ms)^##\s+$versionPattern[^\r\n]*\r?\n(?<body>.*?)(?=^##\s+|\z)"
          )
          if (-not $match.Success) {
            throw "CHANGELOG.md does not contain a section for $env:RELEASE_VERSION."
          }
          $releaseNotes = "# Mirid $env:RELEASE_VERSION`r`n`r`n$($match.Groups['body'].Value.Trim())`r`n"
          [IO.File]::WriteAllText(
            (Join-Path $candidateDirectory 'release-notes.md'),
            $releaseNotes,
            [Text.UTF8Encoding]::new($false)
          )
          "artifact_name=Mirid-$env:RELEASE_VERSION-Windows-candidate" >> $env:GITHUB_OUTPUT

      - name: Upload signed candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.release_files.outputs.artifact_name }}
          path: release-candidate
          if-no-files-found: error
          retention-days: 30

  clean-install:
    name: Qualify candidate on a fresh Windows VM
    needs: build
    runs-on: windows-2025
    timeout-minutes: 300

    steps:
      - name: Check out clean-install test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true

      - name: Download signed candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/mirid-candidate

      - name: Test candidate from an empty Windows profile
        shell: powershell
        env:
          CANDIDATE_DIRECTORY: ${{ runner.temp }}/mirid-candidate
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $installers = @(
            Get-ChildItem -LiteralPath $env:CANDIDATE_DIRECTORY `
              -Filter "Mirid_$($env:EXPECTED_VERSION)_x64-setup.exe" `
              -File `
              -Recurse
          )
          if ($installers.Count -ne 1) {
            throw "Expected one Mirid $env:EXPECTED_VERSION installer, found $($installers.Count)."
          }
          $checksumFiles = @(
            Get-ChildItem -LiteralPath $env:CANDIDATE_DIRECTORY `
              -Filter 'SHA256SUMS.txt' `
              -File `
              -Recurse
          )
          if ($checksumFiles.Count -ne 1) {
            throw "Expected one SHA256SUMS.txt, found $($checksumFiles.Count)."
          }
          $checksumPattern = "^(?<hash>[a-fA-F0-9]{64})\s+$([Regex]::Escape($installers[0].Name))$"
          $checksumLine = (Get-Content -LiteralPath $checksumFiles[0].FullName -Raw).Trim()
          $checksumMatch = [Regex]::Match($checksumLine, $checksumPattern)
          if (-not $checksumMatch.Success) {
            throw "SHA256SUMS.txt does not contain the expected installer checksum."
          }
          .\scripts\test_github_clean_install.ps1 `
            -InstallerPath $installers[0].FullName `
            -InstallerSha256 $checksumMatch.Groups['hash'].Value `
            -ExpectedVersion $env:EXPECTED_VERSION

      - name: Upload clean-install evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mirid-clean-install-${{ needs.build.outputs.version }}-${{ github.run_id }}
          path: artifacts/github-clean-install
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Publish qualified GitHub release
    needs:
      - build
      - clean-install
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release == true) }}
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download qualified candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/mirid-candidate

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          CANDIDATE_DIRECTORY: ${{ runner.temp }}/mirid-candidate
        run: |
          function Get-SingleCandidateFile {
            param([Parameter(Mandatory = $true)][string]$Name)
            $files = @(
              Get-ChildItem -LiteralPath $env:CANDIDATE_DIRECTORY `
                -Filter $Name `
                -File `
                -Recurse
            )
            if ($files.Count -ne 1) {
              throw "Expected one '$Name' candidate file, found $($files.Count)."
            }
            return $files[0].FullName
          }

          $installerName = "Mirid_$($env:RELEASE_VERSION)_x64-setup.exe"
          $installerPath = Get-SingleCandidateFile -Name $installerName
          $installerSignaturePath = Get-SingleCandidateFile -Name "$installerName.sig"
          $latestPath = Get-SingleCandidateFile -Name 'latest.json'
          $checksumsPath = Get-SingleCandidateFile -Name 'SHA256SUMS.txt'
          $releaseNotesPath = Get-SingleCandidateFile -Name 'release-notes.md'

          $arguments = @(
            'release', 'create', "v$env:RELEASE_VERSION",
            $installerPath, $installerSignaturePath,
            $latestPath, $checksumsPath,
            '--title', "Mirid $env:RELEASE_VERSION",
            '--notes-file', $releaseNotesPath
          )
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $arguments += @('--target', $env:GITHUB_SHA)
          }
          else {
            $arguments += '--verify-tag'
          }
          if ($env:PRERELEASE -eq 'true') {
            $arguments += '--prerelease'
          }
          gh @arguments
