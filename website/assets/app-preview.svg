<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="title description">
  <title id="title">Mirid conversation workspace</title>
  <desc id="description">A stylised view of Mirid showing a character conversation, model controls and voice playback.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#171b18"/>
      <stop offset="1" stop-color="#0d100e"/>
    </linearGradient>
    <linearGradient id="portrait" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#be7541"/>
      <stop offset=".58" stop-color="#5b3930"/>
      <stop offset="1" stop-color="#202622"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect x="20" y="20" width="1080" height="680" rx="24" fill="#0b0d0c" stroke="#3a3f3a" filter="url(#shadow)"/>
  <path d="M20 74h1080" stroke="#343934"/>
  <circle cx="54" cy="47" r="7" fill="#9f4d3d"/><circle cx="78" cy="47" r="7" fill="#b88845"/><circle cx="102" cy="47" r="7" fill="#557a5c"/>
  <text x="552" y="53" fill="#cfc9bd" font-size="19" text-anchor="middle" font-family="Segoe UI, sans-serif">Mirid</text>
  <rect x="20" y="74" width="210" height="626" fill="#101311"/>
  <g font-family="Segoe UI, sans-serif">
    <text x="52" y="122" fill="#f1e8d7" font-size="24" font-weight="600">MIRID</text>
    <text x="52" y="166" fill="#777f77" font-size="13" letter-spacing="1.8">WORKSPACE</text>
    <rect x="38" y="184" width="174" height="44" rx="10" fill="#2a261f" stroke="#715032"/>
    <text x="58" y="212" fill="#efc27d" font-size="16">Conversation</text>
    <text x="58" y="262" fill="#a8aea7" font-size="16">Characters</text>
    <text x="58" y="306" fill="#a8aea7" font-size="16">Models</text>
    <text x="58" y="350" fill="#a8aea7" font-size="16">Voice</text>
    <text x="58" y="394" fill="#a8aea7" font-size="16">Images</text>
    <text x="58" y="438" fill="#a8aea7" font-size="16">Chess</text>
    <path d="M38 592h174" stroke="#2e332f"/>
    <circle cx="57" cy="631" r="6" fill="#62a46f"/>
    <text x="74" y="636" fill="#98a098" font-size="14">Local engine ready</text>
    <text x="52" y="672" fill="#626a63" font-size="12">No cloud required</text>
  </g>
  <rect x="230" y="74" width="646" height="626" fill="url(#panel)"/>
  <rect x="876" y="74" width="224" height="626" fill="#111411"/>
  <path d="M876 74v626" stroke="#303530"/>
  <g font-family="Segoe UI, sans-serif">
    <text x="270" y="122" fill="#f2eadc" font-size="22" font-weight="600">A quiet place to think aloud</text>
    <text x="270" y="150" fill="#7f887f" font-size="14">Elara · Local model · 16k context</text>
    <rect x="270" y="190" width="488" height="92" rx="16" fill="#1d221e" stroke="#2d342e"/>
    <text x="292" y="220" fill="#c6cec5" font-size="14" font-weight="600">YOU</text>
    <text x="292" y="250" fill="#e5e1d8" font-size="16">The room feels different tonight. What changed?</text>
    <rect x="330" y="310" width="506" height="150" rx="16" fill="#25231d" stroke="#4a3c29"/>
    <text x="354" y="342" fill="#e9b76b" font-size="14" font-weight="600">ELARA</text>
    <text x="354" y="374" fill="#eee8dc" font-size="16">Nothing you can point to. The rain stopped, perhaps—</text>
    <text x="354" y="400" fill="#eee8dc" font-size="16">or the house finally decided to listen.</text>
    <circle cx="360" cy="433" r="10" fill="#b8783e"/>
    <path d="M356 429l9 4-9 4z" fill="#141714"/>
    <text x="380" y="438" fill="#a9a397" font-size="13">Play voice</text>
    <rect x="270" y="610" width="566" height="58" rx="16" fill="#171b18" stroke="#363d37"/>
    <text x="294" y="645" fill="#777f78" font-size="15">Write the next line…</text>
    <circle cx="801" cy="639" r="18" fill="#d1914f"/>
    <path d="M794 639h12m-5-5 5 5-5 5" fill="none" stroke="#171a17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="910" y="122" fill="#f0e7d8" font-size="16" font-weight="600">Scene</text>
    <rect x="910" y="146" width="156" height="146" rx="16" fill="url(#portrait)"/>
    <circle cx="988" cy="198" r="29" fill="#d3a079" fill-opacity=".6"/>
    <path d="M946 275c5-39 23-59 42-59 22 0 39 20 44 59" fill="#272d28" fill-opacity=".88"/>
    <text x="910" y="326" fill="#e7dfd2" font-size="17" font-weight="600">Elara Voss</text>
    <text x="910" y="350" fill="#868e86" font-size="13">Measured · curious</text>
    <path d="M910 382h156" stroke="#303530"/>
    <text x="910" y="414" fill="#777f77" font-size="12" letter-spacing="1.4">MODEL</text>
    <text x="910" y="442" fill="#ded7ca" font-size="14">Llama 3.3 8B · Q4</text>
    <text x="910" y="482" fill="#777f77" font-size="12" letter-spacing="1.4">VOICE</text>
    <text x="910" y="510" fill="#ded7ca" font-size="14">Kokoro · Heart</text>
    <text x="910" y="550" fill="#777f77" font-size="12" letter-spacing="1.4">MEMORY</text>
    <text x="910" y="578" fill="#ded7ca" font-size="14">Story state on</text>
    <rect x="910" y="620" width="156" height="40" rx="10" fill="#242720" stroke="#51442e"/>
    <text x="988" y="646" fill="#e5b875" font-size="13" text-anchor="middle">Shape this character</text>
  </g>
</svg>
